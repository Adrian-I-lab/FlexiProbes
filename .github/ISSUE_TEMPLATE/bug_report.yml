name: Bug report
description: Something crashes, errors, or behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If you believe the **designed probes themselves**
        are wrong or non-specific, please use the "Incorrect probe design"
        template instead — those are triaged first.

        This is a small academic project maintained on a best-effort basis, so
        responses can take some time.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The exact CLI command, or the settings you used in the New query
        dialog. A minimal input FASTA that triggers it is the single most
        useful thing you can attach.
      placeholder: |
        flexiprobes design --fasta my_genes.fa --out out --blast-db ...
    validations:
      required: true

  - type: textarea
    id: manifest
    attributes:
      label: manifest.json
      description: >-
        Every run writes `manifest.json` to its output directory, recording the
        full resolved configuration, input checksums and the engine commit.
        Attaching it usually removes the need for follow-up questions.
      render: json

  - type: textarea
    id: traceback
    attributes:
      label: Error message or traceback
      render: text

  - type: input
    id: version
    attributes:
      label: flexiprobes version
      description: "Tools → About FlexiProbes in the GUI, or `flexiprobes version` on the command line."
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it?
      options:
        - Desktop app (downloaded binary)
        - Installed from source (pip install -e)
        - CLI on an HPC cluster (container)
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.1 (Apple Silicon) / Windows 11 / Rocky Linux 9"
    validations:
      required: true
